name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'stock-sim/src/stock_sim/render.py'
      - 'stock-sim/templates/**'
      - 'stock-sim/docs/result.example.json'
      - 'stock-sim/publish/result.json'
      - 'stock-sim/tests/test_render.py'
      - 'stock-sim/pyproject.toml'
      - 'stock-sim/uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.13'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: stock-sim/uv.lock
      - name: Check backtest, research gates, and rendering
        run: uv run --frozen --project stock-sim pytest stock-sim/tests
      - name: Build static dashboard
        shell: bash
        run: |
          result=stock-sim/publish/result.json
          if [ ! -f "$result" ]; then
            result=stock-sim/docs/result.example.json
            echo 'Publishing the labeled example dashboard.'
          fi
          uv run --frozen --project stock-sim python stock-sim/src/stock_sim/render.py \
            --result "$result" \
            --template stock-sim/templates/dashboard.html.j2 \
            --out _site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
